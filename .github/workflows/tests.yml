name: Automated tests

# Run this workflow whenever code is pushed to GitHub.
on:
    push:
    pull_request:

# Give the workflow only the permission it requires.
permissions:
  contents: read

jobs:
    run-tests:
        name: Run Tests
        runs-on: ubuntu-latest
            
        steps:

        - name: Checkout
          uses: actions/checkout@v7


        - name: Python Setup
          uses: actions/setup-python@v7
          with:
            python-version: "3.13"
            cache: pip
            cache-dependency-path: |
              requirements.txt

        - name: Install dependencies
          run: |
            python -m pip install --upgrade pip
            python -m pip install -r requirements.txt
            python -m pip check

        - name: run bandit
          run:
            bandit -r src tests -n 3 --severity-level=high

        - name: run pip-audit
          run: pip-audit

        - name: Run tests
          run: python -m pytest tests -v